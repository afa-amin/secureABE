[workspace]
resolver = "2"
members = [
    "core",
    "policy",
    "envelope",
    "audit",
    "authorities",
    "storage",
    "revocation",
    "cli",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
bls12_381 = "0.8"
group = "0.13"
pairing = "0.23"
ff = "0.13"
rand_core = "0.6"
rand = "0.8"
sha3 = "0.10"
sha2 = "0.10"
aes-gcm = "0.10"
hkdf = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
zeroize = { version = "=1.7", features = ["derive"] }